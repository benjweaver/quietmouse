name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      # Warnings are errors via [workspace.lints].
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/check-offline.sh

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: shellcheck --shell=sh scripts/*.sh
      # Every release ships the notices, so a break here would be found at
      # release time otherwise.
      - name: The notices generate for every released target
        run: |
          set -eu
          out=$(sh scripts/third-party-notices.sh \
            aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc \
            x86_64-unknown-linux-musl)
          count=$(printf '%s\n' "$out" | grep -c '^### ')
          # A silent truncation would still look like a valid file, so check
          # the tree came out whole.
          if [ "$count" -lt 50 ]; then
              echo "only $count crates listed; the notices look truncated" >&2
              exit 1
          fi
          echo "$count crates listed"
