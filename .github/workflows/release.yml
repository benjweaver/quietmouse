name: Release

# Builds quietmouse for every platform. Pushing a tag such as v0.1.0 publishes a
# GitHub release with the archives, Linux packages and checksums, but only after
# the Linux packages have installed cleanly on several distributions. Running the
# workflow by hand (Actions → Release → Run workflow) only uploads everything as
# build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # nfpm builds the .deb, .rpm and Arch packages. Pinned and checked against the
  # checksum published with its release.
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            targets: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install musl tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked --target "$target"
          done
        env:
          TARGETS: ${{ matrix.targets }}
      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          dir="quietmouse-${GITHUB_REF_NAME//\//-}-$NAME"
          mkdir "$dir" out
          cp README.md LICENSE "$dir/"
          case "$NAME" in
            windows-*)
              cp "target/$TARGETS/release/quietmouse.exe" "target/$TARGETS/release/quietmoused.exe" "$dir/"
              7z a "out/$dir.zip" "$dir" > /dev/null
              ;;
            macos-*)
              for bin in quietmouse quietmoused; do
                lipo -create -output "$dir/$bin" \
                  "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
              done
              tar -czf "out/$dir.tar.gz" "$dir"
              ;;
            linux-*)
              # The tarball, with install.sh for read-only and other distributions.
              cp "target/$TARGETS/release/quietmouse" "target/$TARGETS/release/quietmoused" "$dir/"
              cp packaging/linux/install.sh "$dir/"
              mkdir -p "$dir/packaging/linux"
              cp packaging/linux/70-quietmouse.rules packaging/linux/modules-load.conf "$dir/packaging/linux/"
              tar -czf "out/$dir.tar.gz" "$dir"
              # Distribution packages.
              mkdir pkgroot
              cp "target/$TARGETS/release/quietmouse" "target/$TARGETS/release/quietmoused" pkgroot/
              curl -fsSL -o nfpm.tar.gz \
                "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
              echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
              tar -xzf nfpm.tar.gz nfpm
              VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
              export VERSION
              for packager in deb rpm archlinux; do
                ./nfpm package --config packaging/linux/nfpm.yaml --packager "$packager" --target out/
              done
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  linux-packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:latest
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -U --noconfirm ./dist/*.pkg.tar.zst
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Install the package
        run: ${{ matrix.install }}
      - name: Check it installed and runs
        run: |
          quietmouse --version
          test -f /usr/lib/udev/rules.d/70-quietmouse.rules
          test -f /usr/lib/modules-load.d/quietmouse.conf
          quietmouse config --init
          quietmouse config --check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { on = 1; next }
            /^## \[/ || /^\[/ { on = 0 }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
