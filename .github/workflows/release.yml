name: Release

# Builds quietmouse for every platform. Pushing a tag such as v0.1.0 publishes a
# GitHub release with the archives, Linux packages and checksums, but only after
# the Linux packages have installed cleanly on several distributions. Running the
# workflow by hand (Actions → Release → Run workflow) only uploads everything as
# build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # nfpm builds the .deb, .rpm and Arch packages. Pinned and checked against the
  # checksum published with its release.
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            targets: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit, since this job goes on to handle the signing certificate.
      # Pinned by hash, the action needs the toolchain named.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Install musl tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked --target "$target"
          done
        env:
          TARGETS: ${{ matrix.targets }}
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Into a keychain of its own, gone with the runner, that codesign can use
          # without asking.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the existing keychains, one argument each
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGETS: ${{ matrix.targets }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          dir="quietmouse-${GITHUB_REF_NAME//\//-}-$NAME"
          mkdir "$dir" out
          cp README.md LICENSE "$dir/"
          # The binaries are statically linked, so the crates' licences have to
          # travel with them. Generate for exactly the targets in this archive.
          # shellcheck disable=SC2086 # deliberate word splitting on the target list
          sh scripts/third-party-notices.sh ${TARGETS//,/ } > "$dir/THIRD-PARTY-NOTICES.md"
          case "$NAME" in
            windows-*)
              # The folder inside the zip keeps the same name in every release,
              # so upgrading by extracting over the previous copy lands the new
              # binaries where the old ones were. `autostart on` puts the full
              # path to quietmoused.exe in the per-user Run key, and a folder
              # named after the version moves it every time: no error, just no
              # quietmouse at sign-in. The archive itself still carries the
              # version in its own name.
              inner=quietmouse
              mv "$dir" "$inner"
              cp "target/$TARGETS/release/quietmouse.exe" "target/$TARGETS/release/quietmoused.exe" "$inner/"
              7z a "out/$dir.zip" "$inner" > /dev/null
              ;;
            macos-*)
              # Signed with the Developer ID, with the hardened runtime and secure
              # timestamp that notarization requires. macOS ties privacy permissions
              # (Input Monitoring, Accessibility) to the signature, and every version
              # carries the same Developer ID, so permissions survive upgrades.
              sign() {
                codesign --force --options runtime --timestamp \
                  --sign "Developer ID Application: Ben Weaver (AR25V66TVY)" "$@"
              }
              lipo -create -output "$dir/quietmouse" \
                "target/aarch64-apple-darwin/release/quietmouse" "target/x86_64-apple-darwin/release/quietmouse"
              # Sign the universal binary as a whole, so both slices carry the signature.
              sign --identifier "io.github.benjweaver.quietmouse.quietmouse" "$dir/quietmouse"
              codesign --verify --all-architectures --strict "$dir/quietmouse"

              # quietmoused's real binary goes inside a minimal .app bundle, with
              # quietmoused itself a symlink into it. Privacy & Security reads an icon
              # for Accessibility and Input Monitoring from the bundle a listed
              # binary's path leads into; a bare binary has none, so it shows a generic
              # icon there. It has to be a symlink, not the bundle sitting directly in
              # this folder: Homebrew's `brew link` only symlinks individual files out
              # of a keg's bin, silently skipping whole directories, so a bundle
              # wouldn't reach the shared bin it puts on PATH. service.rs resolves the
              # symlink to start the exact binary inside the bundle.
              bundle="$dir/quietmoused.app"
              mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
              lipo -create -output "$bundle/Contents/MacOS/quietmoused" \
                "target/aarch64-apple-darwin/release/quietmoused" "target/x86_64-apple-darwin/release/quietmoused"
              cp packaging/macos/quietmouse.icns "$bundle/Contents/Resources/"
              version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
              # One bundle ID for every version. macOS keys a bundle's privacy
              # permissions by its ID and checks them against the Developer ID that
              # every version is signed with, so an upgrade keeps them.
              bundle_id="io.github.benjweaver.quietmouse.quietmoused"
              sed -e "s/__VERSION__/$version/g" -e "s/__BUNDLE_ID__/$bundle_id/g" \
                packaging/macos/Info.plist > "$bundle/Contents/Info.plist"
              # The entitlement lets shell commands bound to buttons (osascript, say)
              # control other apps, which the hardened runtime otherwise blocks.
              sign --identifier "$bundle_id" --entitlements packaging/macos/quietmoused.entitlements "$bundle"
              codesign --verify --all-architectures --strict "$bundle"
              ln -s quietmoused.app/Contents/MacOS/quietmoused "$dir/quietmoused"

              # Notarize both in one submission, then staple the ticket to the bundle.
              # A bare binary can't hold one, so Gatekeeper looks quietmouse's up online
              # the first time, and only if the download was quarantined.
              ditto -c -k --keepParent "$dir" "$RUNNER_TEMP/notarize.zip"
              printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
              notary=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID")
              # A team API key has an issuer; an individual one has none.
              if [ -n "$NOTARY_ISSUER_ID" ]; then notary+=(--issuer "$NOTARY_ISSUER_ID"); fi
              result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" --wait --output-format json)
              if [ "$(plutil -extract status raw -o - - <<< "$result")" != Accepted ]; then
                echo "::error::notarization failed: $result"
                xcrun notarytool log "$(plutil -extract id raw -o - - <<< "$result")" "${notary[@]}" || true
                exit 1
              fi
              rm "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
              xcrun stapler staple "$bundle"
              spctl --assess --type execute "$bundle"

              tar -czf "out/$dir.tar.gz" "$dir"
              ;;
            linux-*)
              # The tarball, with install.sh for read-only and other distributions.
              cp "target/$TARGETS/release/quietmouse" "target/$TARGETS/release/quietmoused" "$dir/"
              cp packaging/linux/install.sh "$dir/"
              mkdir -p "$dir/packaging/linux"
              cp packaging/linux/70-quietmouse.rules packaging/linux/modules-load.conf "$dir/packaging/linux/"
              tar -czf "out/$dir.tar.gz" "$dir"
              # Distribution packages.
              mkdir pkgroot
              cp "target/$TARGETS/release/quietmouse" "target/$TARGETS/release/quietmoused" pkgroot/
              cp "$dir/THIRD-PARTY-NOTICES.md" pkgroot/
              curl -fsSL -o nfpm.tar.gz \
                "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
              echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
              tar -xzf nfpm.tar.gz nfpm
              VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
              export VERSION
              for packager in deb rpm archlinux; do
                ./nfpm package --config packaging/linux/nfpm.yaml --packager "$packager" --target out/
              done
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  linux-packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:latest
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -U --noconfirm ./dist/*.pkg.tar.zst
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Install the package
        run: ${{ matrix.install }}
      - name: Check it installed and runs
        run: |
          quietmouse --version
          test -f /usr/lib/udev/rules.d/70-quietmouse.rules
          test -f /usr/lib/modules-load.d/quietmouse.conf
          quietmouse config --init
          quietmouse config --check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { on = 1; next }
            /^## \[/ || /^\[/ { on = 0 }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md

  tap:
    # Points the Homebrew tap at this release. GITHUB_TOKEN can't push to another
    # repository, so this checks the tap out with a deploy key that can write to it
    # and nothing else (the TAP_DEPLOY_KEY secret). The push starts the tap's tests.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benjweaver/homebrew-quietmouse
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/update-formula.sh "$GITHUB_REF_NAME"
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "The formula already points at $GITHUB_REF_NAME."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quietmouse ${GITHUB_REF_NAME#v}"
          git push
